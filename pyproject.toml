[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-search"
version = "1.0.0"
description = "Локальный RAG-поиск по базе знаний: ChromaDB, E5-эмбеддинги, LLM через Ollama"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "arlequiiin" }]
dependencies = [
    "chromadb>=0.5",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
    "ollama>=0.3",
]
app = [
    "streamlit>=1.36",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]
data = [
    "pandas>=2.0",
    "pyarrow>=15",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]
all = ["local-rag-search[ml,app,data]"]

[project.scripts]
rag-search = "rag_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
